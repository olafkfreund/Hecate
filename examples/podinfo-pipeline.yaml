# A three-Gate pipeline: dev -> staging -> production.
#
# There is no pipeline object. The graph is implied by what each Gate admits:
# staging admits only Bundles that cleared dev, production only those that
# cleared staging. The topology cannot drift out of sync with the Gates.
#
# Hecate never talks to Flux. Each Passage renders new state into git, pushes
# it, and then `flux-wait` blocks until the Flux Kustomization has applied that
# exact commit. Git is the rendezvous.
#
# Prerequisites: Flux installed, with a Kustomization per environment pointed at
# the corresponding path in the deploy repo.
---
apiVersion: hecate.dev/v1alpha1
kind: Beacon
metadata:
  name: podinfo
  namespace: acme
spec:
  interval: 2m
  watch:
    - image:
        repo: ghcr.io/stefanprodan/podinfo
        select: SemVer
        constraint: ^6.0.0
        # Exclude the mutable tags that otherwise cause surprise crossings.
        ignore: [latest, main]

---
apiVersion: hecate.dev/v1alpha1
kind: Gate
metadata:
  name: dev
  namespace: acme
spec:
  # No `after`, so dev is the entry point: it takes Bundles straight from the
  # Beacon, and does so without being asked.
  admits:
    - from: { beacon: podinfo }
  auto: true
  passage:
    steps:
      - uses: git-clone
        with:
          repo: https://github.com/acme/deploy.git
          branch: main
          # A Secret with `username`+`password` (a token), or `identity` for
          # SSH. Every git step resolves credentials independently, so this is
          # named again on git-push below rather than inherited.
          credentialsRef:
            name: deploy-repo
      - uses: set-image
        with:
          path: repo/envs/dev/kustomization.yaml
          image: ghcr.io/stefanprodan/podinfo
      - uses: git-commit
        as: commit
        with:
          message: "dev: podinfo ${{ bundle.image('ghcr.io/stefanprodan/podinfo').tag }}"
      - uses: git-push
        with:
          # Each git step resolves its own credentials — git-push does not
          # inherit git-clone's. Omitting this pushes anonymously and fails
          # after the commit is already made.
          credentialsRef:
            name: deploy-repo
      - uses: flux-wait
        with:
          resources:
            - { kind: Kustomization, name: podinfo-dev, namespace: flux-system }
          # Wait for the commit this Passage just pushed, not merely for
          # "Ready" — otherwise a stale green from the previous revision passes.
          expectedRevision: ${{ steps.commit.sha }}

---
apiVersion: hecate.dev/v1alpha1
kind: Gate
metadata:
  name: staging
  namespace: acme
spec:
  admits:
    - from: { beacon: podinfo }
      after: [dev]
  auto: true
  passage:
    steps:
      - uses: git-clone
        with:
          repo: https://github.com/acme/deploy.git
          branch: main
          # A Secret with `username`+`password` (a token), or `identity` for
          # SSH. Every git step resolves credentials independently, so this is
          # named again on git-push below rather than inherited.
          credentialsRef:
            name: deploy-repo
      - uses: set-image
        with:
          path: repo/envs/staging/kustomization.yaml
          image: ghcr.io/stefanprodan/podinfo
      - uses: git-commit
        as: commit
        with:
          message: "staging: podinfo ${{ bundle.image('ghcr.io/stefanprodan/podinfo').tag }}"
      - uses: git-push
        with:
          # Each git step resolves its own credentials — git-push does not
          # inherit git-clone's. Omitting this pushes anonymously and fails
          # after the commit is already made.
          credentialsRef:
            name: deploy-repo
      - uses: flux-wait
        with:
          resources:
            - { kind: Kustomization, name: podinfo-staging, namespace: flux-system }
            - { kind: HelmRelease, name: podinfo-redis, namespace: staging }
          expectedRevision: ${{ steps.commit.sha }}
          failAfter: 10m
  # Health says "it is running". Verification says "it worked". Downstream Gates
  # admit only Bundles that were verified here.
  verify:
    - uses: flagger
      with:
        canary: { name: podinfo, namespace: staging }

---
apiVersion: hecate.dev/v1alpha1
kind: Gate
metadata:
  name: production
  namespace: acme
spec:
  admits:
    - from: { beacon: podinfo }
      after: [staging]
      requireApproval: true
  # Weekday mornings, London time. Set the zone deliberately: a window defined
  # in UTC drifts an hour against local working time twice a year.
  windows:
    - schedule: "0 9 * * 1-5"
      duration: 6h
      timeZone: Europe/London
  passage:
    steps:
      # Evidence before anything is written. A HOLD verdict stops the Passage
      # here, leaving production untouched.
      - uses: evidence-gate
        with:
          maxRisk: 30
      - uses: git-clone
        with:
          repo: https://github.com/acme/deploy.git
          branch: main
          # A Secret with `username`+`password` (a token), or `identity` for
          # SSH. Every git step resolves credentials independently, so this is
          # named again on git-push below rather than inherited.
          credentialsRef:
            name: deploy-repo
      - uses: set-image
        with:
          path: repo/envs/prod/kustomization.yaml
          image: ghcr.io/stefanprodan/podinfo
      - uses: git-commit
        as: commit
        with:
          message: "prod: podinfo ${{ bundle.image('ghcr.io/stefanprodan/podinfo').tag }}"
      # Production goes through review rather than straight to main.
      - uses: git-push
        as: push
        with:
          toNewBranch: true
          credentialsRef:
            name: deploy-repo
      - uses: git-pull-request
        with:
          repo: https://github.com/acme/deploy.git
          from: ${{ steps.push.branch }}
          into: main
          waitForMerge: true
      - uses: flux-wait
        with:
          resources:
            - { kind: Kustomization, name: podinfo-prod, namespace: flux-system }
          expectedRevision: ${{ steps.commit.sha }}
          # Production rollouts are slower; allow longer before calling it wedged.
          failAfter: 20m
