name: Release

on:
  push:
    tags: ['v*']
  # Dry run without publishing, so the pipeline can be exercised before a tag
  # commits us to a version that cannot be unpublished.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v), e.g. 0.1.0'
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/hecate-controller
  CHART: ${{ github.repository_owner }}/charts

jobs:
  version:
    name: Version is consistent
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v6

      # The tag is the source of truth, and the chart takes its version from a
      # `helm package` flag rather than from Chart.yaml — so there is nothing to
      # bump there and nothing to drift. flake.nix is the one other place a
      # version lives, because a Nix build has to bake it in, so that one is
      # asserted rather than derived.
      - id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            version="${GITHUB_REF_NAME#v}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          flake=$(grep -oP 'version = "\K[^"]+' flake.nix | head -1)
          if [ "$flake" != "$version" ]; then
            echo "::error::flake.nix says $flake but the release is $version. Bump it and retag."
            exit 1
          fi
          echo "Releasing $version"

  image:
    name: Image
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # cosign keyless: no long-lived signing key to leak
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      # No setup-qemu-action: the Dockerfile cross-compiles from BUILDPLATFORM,
      # so nothing is emulated and there is no binfmt to register.
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3

      - name: Log in to ${{ env.REGISTRY }}
        if: needs.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.version.outputs.publish == 'true' }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          # buildx attaches both as attestations, so no separate syft step and
          # nothing to keep in sync with the image it describes.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Signed by digest, not by tag: a tag can be moved to point at something
      # else, and then the signature would vouch for the wrong image.
      - name: Sign
        if: needs.version.outputs.publish == 'true'
        run: cosign sign --yes "${REGISTRY}/${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Verify the signature we just made
        if: needs.version.outputs.publish == 'true'
        run: |
          cosign verify "${REGISTRY}/${IMAGE}@${{ steps.build.outputs.digest }}" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  chart:
    name: Chart
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
      - uses: sigstore/cosign-installer@v3

      - name: Package
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          # Version comes from the flag, so Chart.yaml never needs bumping and
          # can never disagree with the release.
          # Lint first: linting a chart that has already been packaged cannot
          # stop it being packaged.
          helm lint charts/hecate
          helm package charts/hecate --version "$v" --app-version "$v" --destination dist

      # Helm installs a chart's crds/ once and never upgrades them, so an
      # upgrading user needs the CRDs as something they can apply themselves.
      # Shipped as one file because `kubectl apply -f` should be one command.
      - name: Collect the CRDs as a release asset
        run: |
          set -euo pipefail
          : > dist/crds.yaml
          for crd in charts/hecate/crds/*.yaml; do
            echo "---" >> dist/crds.yaml
            cat "$crd" >> dist/crds.yaml
          done
          # An asset that does not apply is worse than none: it would be found
          # mid-upgrade, by someone whose controller is already rolling out.
          #
          # Checked by counting documents rather than with `kubectl apply
          # --dry-run=client`, which was here first and cannot work: client
          # dry-run still fetches the OpenAPI schema and still needs the
          # server's API group list to resolve the kind, so it fails on a runner
          # with no cluster. It would have failed the first tag ever pushed.
          #
          # The CRDs themselves are already validated elsewhere — `make check`
          # fails if the committed output has drifted from the Go types, and
          # every e2e run applies them to a real API server. What is unproven at
          # this point is only the *concatenation*, and a document count catches
          # the ways that goes wrong: a truncated file, a missing separator, an
          # empty loop over a directory that moved.
          want=$(ls charts/hecate/crds/*.yaml | wc -l)
          got=$(grep -c '^kind: CustomResourceDefinition' dist/crds.yaml || true)
          test "$want" -gt 0 || { echo "::error::no CRDs found to collect"; exit 1; }
          if [ "$got" != "$want" ]; then
            echo "::error::crds.yaml has $got CustomResourceDefinition documents, want $want"
            exit 1
          fi
          echo "crds.yaml: $got CRDs, $(wc -c < dist/crds.yaml) bytes"

      # Two logins, one per tool, and they are not interchangeable: `helm
      # registry login` writes helm's own credential store, while cosign reads
      # Docker's. With only the first, the chart pushes and then the signature
      # fails with UNAUTHORIZED — which is how the first tag ever pushed died,
      # after publishing an unsigned chart.
      - name: Log in to ${{ env.REGISTRY }}
        if: needs.version.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push as an OCI artifact
        if: needs.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }}
          # OCI so Flux users can consume the chart with an OCIRepository rather
          # than needing a chart repository to exist.
          out=$(helm push "dist/hecate-$v.tgz" "oci://${{ env.REGISTRY }}/${{ env.CHART }}" 2>&1)
          echo "$out"
          digest=$(echo "$out" | grep -oP 'Digest: \K.*')
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.CHART }}/hecate@${digest}"

      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: |
            dist/*.tgz
            dist/crds.yaml

  cli:
    name: CLI binaries
    needs: version
    # Not gated on publish, unlike the release job below. A dry run exists to
    # exercise the pipeline before a tag commits us to a version that cannot be
    # unpublished, and skipping this job skipped the cross-compile for four
    # platforms and every signing step — the two things most likely to fail on
    # a first release and least likely to be noticed beforehand. Nothing here
    # leaves the runner; only the release job publishes.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # cosign keyless, as for the image and the chart
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0

      # An evidence-verification tool nobody can download is a tool nobody runs,
      # and the whole point of #104 is that the person relying on the trail can
      # check it themselves.
      - name: Build
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${platform%/*}"; arch="${platform#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$v" \
              -o "dist/hecate-$os-$arch" ./cmd/hecate
          done
          cd dist && sha256sum hecate-* > checksums.txt

      # The checksum file is signed rather than each binary: it already commits
      # to every one of them by digest, so one signature covers the set and
      # verifying a download is two commands instead of two per file.
      #
      # Unsigned, a checksums.txt is worth very little — whoever can replace the
      # binaries on a release page can replace the checksums beside them.
      - name: Sign the checksums
        run: |
          cd dist
          cosign sign-blob --yes checksums.txt \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem

      - name: Verify what we just signed
        run: |
          cd dist
          cosign verify-blob checksums.txt \
            --signature checksums.txt.sig --certificate checksums.txt.pem \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # The image gets its SBOM from buildx. The binaries need their own: they
      # are what most people actually download, and "which version of x/crypto
      # is in the thing on my laptop" is the question a CVE announcement asks.
      - name: SBOM
        run: |
          # The binary, not the source tree: a Go binary embeds its module graph,
          # so this describes what is actually compiled in rather than what
          # go.mod would permit. Any of the four would do — they are the same
          # dependencies — so the linux/amd64 one stands for the set.
          syft scan file:dist/hecate-linux-amd64 \
            --source-name hecate --source-version "${{ needs.version.outputs.version }}" \
            -o spdx-json > dist/hecate-sbom.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/

  release:
    name: GitHub release
    needs: [version, image, chart, cli]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with: { name: chart, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: cli, path: dist }

      # Dogfood (#57). Recording only, never gating: Fides refusing a Hecate
      # release would let the evidence system stop the tool that reads it from
      # shipping a fix, including a fix to the integration between them.
      #
      # continue-on-error is deliberately ABSENT. The equivalent job elsewhere
      # had it, and that is precisely how five weeks of releases posted evidence
      # to a placeholder token while reporting success. If this is configured
      # and broken, the release should say so.
      - name: Record the release in Fides
        id: fides
        env:
          FIDES_SERVER_URL: ${{ vars.FIDES_SERVER_URL }}
          FIDES_API_TOKEN: ${{ secrets.FIDES_API_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          outcome=$(scripts/release-attest.sh)
          echo "$outcome"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          cat > notes.md <<EOF
          ## Evidence

          \`${{ steps.fides.outputs.outcome }}\`

          Recorded, not gated — see \`scripts/release-attest.sh\` for why. A
          release that recorded nothing says so here rather than looking
          identical to one that recorded a clean bill of health.

          ## Install

          \`\`\`console
          helm install hecate oci://${{ env.REGISTRY }}/${{ env.CHART }}/hecate --version $v \\
            --namespace hecate-system --create-namespace
          \`\`\`

          ## Upgrading

          Apply the CRDs first. Helm installs a chart's \`crds/\` once and never
          touches them again, so \`helm upgrade\` alone ships a new controller
          against the old API — and the API server prunes unknown fields
          silently rather than rejecting them.

          \`\`\`console
          kubectl apply --server-side -f \\
            https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/crds.yaml
          helm upgrade hecate oci://${{ env.REGISTRY }}/${{ env.CHART }}/hecate --version $v \\
            --namespace hecate-system
          \`\`\`

          Hecate refuses to start against CRDs older than itself, so skipping
          this is a failed rollout rather than a silent behaviour change.

          **Read [Behaviour changes](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/docs/UPGRADING.md#behaviour-changes-by-version)
          before upgrading.** These notes are generated from a fixed template
          and say nothing about what changed, so anything that alters what
          Hecate *does* — as opposed to what it offers — is recorded there
          instead. A change that looks like a regression when you meet it
          unannounced is the one worth reading first.

          Image: \`${{ env.REGISTRY }}/${{ env.IMAGE }}:$v\`
          Digest: \`${{ needs.image.outputs.digest }}\`

          ## Verifying a promotion's evidence

          \`\`\`console
          hecate verify <bundle> --server https://fides.example.com
          \`\`\`

          Exits 3 when an attestation chain has been tampered with.

          ## Verifying what you downloaded

          Everything here is signed with cosign, keyless: there is no public key
          to fetch and no signing key of ours to be stolen. The certificate says
          which workflow in which repository produced the artifact, which is the
          claim worth checking.

          The image, by digest — a tag can be moved, a digest cannot:

          \`\`\`console
          cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ needs.image.outputs.digest }} \\
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          The CLI binaries. \`checksums.txt\` commits to every binary by digest,
          so verifying it and then checking your download against it covers the
          lot — and unsigned it would be worth little, since whoever could
          replace the binaries could replace the checksums beside them:

          \`\`\`console
          cosign verify-blob checksums.txt \\
            --signature checksums.txt.sig --certificate checksums.txt.pem \\
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --check --ignore-missing checksums.txt
          \`\`\`

          SBOMs: the image carries one as a buildx attestation
          (\`cosign download sbom\`), and the binaries have
          \`hecate-sbom.spdx.json\` attached here.
          EOF
          # Listed explicitly rather than with `dist/*.tgz dist/hecate-*`, which
          # was wrong twice over: those globs both match the chart tarball, so
          # it was passed as two assets of the same name — and neither matched
          # crds.yaml, which the upgrade instructions above tell people to
          # download. An upgrade path pointing at a 404 is the worst asset to
          # get wrong, because it is found mid-rollout.
          gh release create "$GITHUB_REF_NAME" \
            dist/hecate-*.tgz \
            dist/crds.yaml \
            dist/hecate-linux-* dist/hecate-darwin-* \
            dist/checksums.txt dist/checksums.txt.sig dist/checksums.txt.pem \
            dist/hecate-sbom.spdx.json \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
