name: E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so upstream Flux releases surface here rather than in an issue.
    - cron: '0 3 * * *'
  # So the provider job can be run on demand rather than only at 03:00.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crossing:
    name: Crossing on k3d (Flux ${{ matrix.flux }}, k8s ${{ matrix.k3s }})
    runs-on: ubuntu-latest
    # A hung step otherwise runs until GitHub's six-hour default. k3d cluster
    # creation has hung here once, mid-"Starting agents", which burned twenty
    # minutes of a runner and told us nothing we could not have learnt in five.
    timeout-minutes: 30
    # Scoped to the workspace, matching the dev shell: no step can reach a real
    # cluster even by accident.
    env:
      KUBECONFIG: ${{ github.workspace }}/.dev/kubeconfig
      # Which e2e tests run in which phase. Every test in the package must
      # appear in one of these; a step below enforces that.
      BEFORE_INSTALL: 'TestCrossingAgainstRealAPI|TestFidesEnvironmentIsValidatedAtAdmission'
      AFTER_INSTALL: 'TestDeployedControllerCrossesAGate|TestDeployedControllerPromotesThroughGit|TestAnnotationTriggersAnImmediatePoll'
      # The version flake.nix gives the dev shell, so a cluster in CI is the
      # cluster a developer gets.
      K3D_VERSION: v5.9.0
    strategy:
      fail-fast: false
      matrix:
        # The three minors Flux itself supports. A Flux release that breaks us
        # fails a build rather than a user's cluster — see #90.
        #
        # This list is read by .github/workflows/flux-upstream.yml, which opens
        # an issue when a Flux minor appears that is not in it. Keep the shape.
        flux: ['2.7', '2.8', '2.9']
        # Each leg also pins a different Kubernetes, so the three between them
        # span the N-2 range the README claims (#88). `include` adds a field to
        # a combination that already exists rather than multiplying the matrix,
        # so this stays three jobs rather than nine.
        #
        # The pairing is oldest-with-oldest deliberately: that is the
        # combination most likely to break. It does mean the *cross* product is
        # untested — new Flux on old Kubernetes is not covered — and the support
        # matrix says so rather than implying otherwise.
        include:
          - flux: '2.7'
            k3s: 'rancher/k3s:v1.34.10-k3s1'   # N-2
          - flux: '2.8'
            k3s: 'rancher/k3s:v1.35.7-k3s1'    # N-1
          - flux: '2.9'
            k3s: 'rancher/k3s:v1.36.3-k3s1'    # N
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@v4

      # Cached, because fetching it is the step that has failed most: first
      # `curl: (56) Connection died` against the install script, then six
      # straight 503s from the release CDN even with retries. A cache hit needs
      # no network at all, which is the only fix that does not depend on
      # GitHub having a good day.
      - name: Cache k3d
        uses: actions/cache@v4
        with:
          path: ~/.cache/hecate/k3d
          key: k3d-${{ env.K3D_VERSION }}-linux-amd64

      - name: Install k3d
        run: |
          set -euo pipefail
          bin=~/.cache/hecate/k3d
          if [ ! -x "$bin" ]; then
            mkdir -p "$(dirname "$bin")"
            # More patient than the default: a 503 from the release CDN clears
            # in a minute, and the alternative is a red matrix leg.
            curl -fsSL --retry 8 --retry-all-errors --retry-delay 5 -o "$bin" \
              "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
            chmod +x "$bin"
          fi
          sudo install -m 0755 "$bin" /usr/local/bin/k3d
          k3d version

      - name: Install Flux ${{ matrix.flux }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Resolve the newest patch of this minor at run time rather than
          # pinning: pinned patches go stale silently, and the point of this
          # matrix is to notice when a *current* Flux breaks us (#90).
          TAG=$(gh api "repos/fluxcd/flux2/releases?per_page=100" \
            --jq '[.[] | select(.prerelease|not) | .tag_name | select(startswith("v${{ matrix.flux }}."))] | first')
          test -n "$TAG" || { echo "no release found for v${{ matrix.flux }}"; exit 1; }
          echo "Resolved v${{ matrix.flux }} -> $TAG"

          # The CLI version must match the manifests it installs — flux refuses
          # otherwise. So pin the CLI itself rather than passing --version.
          curl -s https://fluxcd.io/install.sh | sudo FLUX_VERSION="${TAG#v}" bash
          flux --version

      # The same script developers run, so a break here is a break for them
      # too — and the script itself gets tested rather than only the workflow.
      - name: Create the cluster (Kubernetes ${{ matrix.k3s }})
        env:
          K3S_IMAGE: ${{ matrix.k3s }}
        run: ./scripts/dev-cluster.sh up

      # The two phases below select tests by name, because one needs Hecate
      # deployed and the other must not have it. That makes it possible to add a
      # test that never runs while the job stays green — which happened. This
      # step fails if any test in the package matches neither phase.
      - name: Every e2e test is claimed by a phase
        run: |
          set -euo pipefail
          all=$(go test -tags e2e -list '.*' ./test/e2e/... | grep '^Test' | sort)
          claimed=$(printf '%s\n' $BEFORE_INSTALL $AFTER_INSTALL | tr '|' '\n' | sort)
          orphans=$(comm -23 <(echo "$all") <(echo "$claimed"))
          if [ -n "$orphans" ]; then
            echo "These e2e tests are in neither phase, so they never run:"
            echo "$orphans"
            echo "Add each to BEFORE_INSTALL or AFTER_INSTALL in this workflow."
            exit 1
          fi

      # Before installing: these drive the reconcilers themselves, or need only
      # the CRDs, so a deployed controller would race them.
      - name: E2E — API contract (no controller deployed)
        run: go test -tags e2e -count=1 -timeout 10m -v -run "^($BEFORE_INSTALL)$" ./test/e2e/...

      - name: Build and install Hecate
        run: make install

      # After installing: the whole product as a deployment.
      - name: E2E — deployed controller
        run: go test -tags e2e -count=1 -timeout 20m -v -run "^($AFTER_INSTALL)$" ./test/e2e/...

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get beacons,bundles,gates,passages -A -o wide || true
          kubectl -n hecate-system logs deploy/hecate --tail=100 || true
          kubectl -n flux-system get all || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true

  providers:
    name: Promotion against real GitHub
    # Nightly only. It depends on a third party over the network, so running it
    # per-push would turn GitHub's bad afternoon into Hecate's red build — and
    # a red build nobody trusts is one nobody reads.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Absent on a fork, and on this repo until the token is installed. Skipped
      # rather than failed: a job that goes red for a missing credential trains
      # people to ignore it going red for a broken adapter.
      - name: Is there a token?
        id: token
        run: |
          if [ -n "${{ secrets.E2E_GITHUB_TOKEN }}" ]; then echo "have=yes" >> "$GITHUB_OUTPUT"
          else echo "have=no" >> "$GITHUB_OUTPUT"; echo "::warning::E2E_GITHUB_TOKEN is not set — the GitHub provider is unproven tonight"; fi

      - name: E2E — GitHub pull request lifecycle
        if: steps.token.outputs.have == 'yes'
        env:
          HECATE_E2E_GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
        run: go test -tags e2e -count=1 -timeout 10m -v ./test/provider/...
