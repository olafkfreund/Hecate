name: E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, so upstream Flux releases surface here rather than in an issue.
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  crossing:
    name: Crossing on k3d (Flux ${{ matrix.flux }})
    runs-on: ubuntu-latest
    # Scoped to the workspace, matching the dev shell: no step can reach a real
    # cluster even by accident.
    env:
      KUBECONFIG: ${{ github.workspace }}/.dev/kubeconfig
    strategy:
      fail-fast: false
      matrix:
        # The three minors Flux itself supports. A Flux release that breaks us
        # fails a build rather than a user's cluster — see #90.
        flux: ['2.7', '2.8', '2.9']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@v4

      - name: Install k3d
        run: curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

      - name: Install Flux ${{ matrix.flux }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Resolve the newest patch of this minor at run time rather than
          # pinning: pinned patches go stale silently, and the point of this
          # matrix is to notice when a *current* Flux breaks us (#90).
          TAG=$(gh api "repos/fluxcd/flux2/releases?per_page=100" \
            --jq '[.[] | select(.prerelease|not) | .tag_name | select(startswith("v${{ matrix.flux }}."))] | first')
          test -n "$TAG" || { echo "no release found for v${{ matrix.flux }}"; exit 1; }
          echo "Resolved v${{ matrix.flux }} -> $TAG"

          # The CLI version must match the manifests it installs — flux refuses
          # otherwise. So pin the CLI itself rather than passing --version.
          curl -s https://fluxcd.io/install.sh | sudo FLUX_VERSION="${TAG#v}" bash
          flux --version

      # The same script developers run, so a break here is a break for them
      # too — and the script itself gets tested rather than only the workflow.
      - name: Create the cluster
        run: ./scripts/dev-cluster.sh up

      # Before installing: the API-contract test drives the reconcilers itself,
      # so a deployed controller would race it.
      - name: E2E — API contract (no controller deployed)
        run: go test -tags e2e -count=1 -timeout 10m -v -run TestCrossingAgainstRealAPI ./test/e2e/...

      - name: Build and install Hecate
        run: make install

      # After installing: the whole product as a deployment.
      - name: E2E — deployed controller
        run: go test -tags e2e -count=1 -timeout 20m -v -run TestDeployedControllerCrossesAGate ./test/e2e/...

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get beacons,bundles,gates,passages -A -o wide || true
          kubectl -n hecate-system logs deploy/hecate --tail=100 || true
          kubectl -n flux-system get all || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -50 || true
