name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: |
          set -o pipefail
          go test -race -coverprofile=coverage.out -json ./... | tee gotest.jsonl

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # Record the unit-test result on the Fides `hecate` trail as a
      # `test-result` attestation (payload: passed/failed/skipped/total) — the
      # same tamper-evident chain the portal CR "Tests" tab and ServiceNow
      # u_fides_test_result mirror read back. Flow resolved by name; trail keyed
      # by commit sha. always() so a failing suite still records compliant=false.
      # Inert until FIDES secrets are set.
      - name: Attest test results to Fides
        if: ${{ always() }}
        env:
          FIDES_SERVER_URL: ${{ vars.FIDES_SERVER_URL }}
          FIDES_API_TOKEN: ${{ secrets.FIDES_API_TOKEN }}
          FIDES_FLOW: hecate
          TRAIL_NAME: ${{ github.sha }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "${FIDES_API_TOKEN}" ] && [ -n "${FIDES_SERVER_URL}" ] || { echo "Fides not configured; skipping"; exit 0; }
          [ -f gotest.jsonl ] || { echo "no gotest.jsonl; skipping"; exit 0; }
          base="${FIDES_SERVER_URL%/}/api/v1"
          auth="Authorization: Bearer ${FIDES_API_TOKEN}"
          flow_id="$(curl -sf -H "$auth" "$base/flows" | jq -r --arg n "$FIDES_FLOW" '.[]?|select(.name==$n)|.id' | head -1 || true)"
          [ -n "${flow_id:-}" ] && [ "$flow_id" != "null" ] || { echo "flow $FIDES_FLOW not found; skipping"; exit 0; }
          trail_id="$(curl -sf -H "$auth" "$base/flows/$flow_id/trails" | jq -r --arg n "$TRAIL_NAME" '.[]?|select(.name==$n)|.id' | head -1 || true)"
          if [ -z "${trail_id:-}" ] || [ "$trail_id" = "null" ]; then
            trail_id="$(curl -sf -H "$auth" -H 'Content-Type: application/json' -X POST "$base/trails" \
              -d "$(jq -n --arg f "$flow_id" --arg n "$TRAIL_NAME" --arg c "$COMMIT_SHA" --arg r "$REPO_URL" \
                    '{flow_id:$f,name:$n,git_commit:$c,git_repository:$r}')" | jq -r '.id')"
          fi
          # go test -json: count test-level events (package-level events have no .Test)
          P=$(jq -rs 'map(select(.Test!=null and .Action=="pass"))|length' gotest.jsonl)
          F=$(jq -rs 'map(select(.Test!=null and .Action=="fail"))|length' gotest.jsonl)
          Sk=$(jq -rs 'map(select(.Test!=null and .Action=="skip"))|length' gotest.jsonl)
          Tt=$((P + F + Sk))
          if [ "$F" = "0" ]; then C=true; else C=false; fi
          payload="$(jq -nc --argjson c "$C" --argjson p "$P" --argjson f "$F" --argjson s "$Sk" --argjson t "$Tt" \
            '{compliant:$c,passed:$p,failed:$f,skipped:$s,total:$t,suite:"hecate go test"}')"
          curl -sf -H "$auth" -H 'Content-Type: application/json' -X POST "$base/attestations" \
            -d "$(jq -n --arg tid "$trail_id" --arg pl "$payload" \
                  '{trail_id:$tid,name:"unit-tests",type_name:"test-result",payload:$pl}')" >/dev/null
          echo "attested test-result on trail $trail_id: passed=$P failed=$F skipped=$Sk total=$Tt"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  generated:
    name: Generated files are current
    runs-on: ubuntu-latest
    # cmd/supportmatrix reads this run's actions history to tell a proven
    # provider or registry from a merely configured one (#8, D57).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Generated through the dev shell, not a separately pinned controller-gen.
      # Two pinned versions of a generator is two sources of truth: each stamps
      # its own version into the CRD annotation, so the check fails for everyone
      # whose local toolchain differs from CI's. The flake is the one pin.
      - name: Regenerate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: nix develop --command make generate

      - name: Check for drift
        run: |
          if ! git diff --quiet; then
            echo "Generated files are out of date. Run 'nix develop --command make generate' and commit:"
            git diff
            # cmd/supportmatrix (#8) reads live CI run history on main rather than
            # only the tree, so README.md's support-matrix block can drift with no
            # code change on this branch at all — a nightly job's result changed,
            # or aged out of the run window it searches. When README.md is the
            # only file that moved, say so plainly rather than leaving whoever
            # is looking at an unrelated PR to work that out from a diff.
            if [ "$(git diff --name-only)" = "README.md" ]; then
              echo
              echo "Note: README.md is the only file that changed. If the diff is inside the"
              echo "<!-- support-matrix:start/end --> block, this is not necessarily caused by"
              echo "your change — that table reflects the most recent relevant CI run on main,"
              echo "and can shift with no code change (see D57). Re-run"
              echo "'go run ./cmd/supportmatrix' and commit the refreshed table."
            fi
            exit 1
          fi

  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Matches pkgs.nodejs_24 in flake.nix, so CI builds what the dev
          # shell builds. A different Node is a different artifact, and this
          # one is embedded in a binary shipped to users.
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # --include=dev explicitly: a runner with NODE_ENV=production omits
      # devDependencies, and the build needs TypeScript and Tailwind from
      # there. That failure looks like a missing module, not a config problem.
      - run: npm ci --include=dev --no-audit --no-fund
        working-directory: ui

      - run: npm run lint
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
