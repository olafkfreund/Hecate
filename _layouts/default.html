<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="{{ '/assets/css/gruvbox.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128273;</text></svg>">
  {% seo %}
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-key">&#9919;</span>
      <span class="brand-name">Hecate</span>
    </a>
    <nav class="site-nav">
      <a href="#why">Why</a>
      <a href="#how">How</a>
      <a href="#fides">Evidence</a>
      <a href="#roadmap">Roadmap</a>
      <a class="nav-cta" href="https://github.com/{{ site.repository }}">GitHub &#8599;</a>
    </nav>
  </div>
</header>

<main class="wrap content">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>
      <strong>Hecate</strong> &mdash; <em>Kleidouchos</em>, the key-holder.
      Apache&nbsp;2.0 &middot;
      <a href="https://github.com/{{ site.repository }}">github.com/{{ site.repository }}</a>
    </p>
    <p class="muted">
      Not affiliated with the FluxCD project, the CNCF, or Akuity.
      Built on <a href="https://github.com/akuity/kargo">Kargo</a> (Apache&nbsp;2.0).
    </p>
  </div>
</footer>

</body>
</html>
