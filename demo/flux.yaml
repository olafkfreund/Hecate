# What Flux reads, for the demo's three environments.
#
# The repository is public and read anonymously — no secretRef. That is the
# point: the read path has no credential to expire, rotate or lose, so the only
# credential in the demo is the SSH deploy key Hecate writes with. The previous
# arrangement was an in-cluster Gitea whose storage was an emptyDir, and every
# reschedule took the fleet repo with it.
#
# These live in `demo` rather than `flux-system` so that one namespace holds the
# whole demo: the Gates, the Bundles, and the Flux objects their flux-wait steps
# watch.
#
#   kubectl apply -f demo/flux.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fleet
  namespace: demo
spec:
  interval: 1m
  url: https://github.com/olafkfreund/hecate-demo-fleet.git
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podtato-dev
  namespace: demo
spec:
  interval: 1m
  path: ./apps/dev
  prune: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: fleet
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podtato-qa
  namespace: demo
spec:
  interval: 1m
  path: ./apps/qa
  prune: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: fleet
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podtato-production
  namespace: demo
spec:
  interval: 1m
  path: ./apps/production
  prune: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: fleet
