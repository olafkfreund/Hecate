---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hecate-controller
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - hecate.dev
  resources:
  - beacons
  - gates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - hecate.dev
  resources:
  - beacons/status
  - bundles/status
  - gates/status
  - passages/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - hecate.dev
  resources:
  - bundles
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - hecate.dev
  resources:
  - passages
  verbs:
  - create
  - get
  - list
  - update
  - watch
- apiGroups:
  - helm.toolkit.fluxcd.io
  resources:
  - helmreleases
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - kustomize.toolkit.fluxcd.io
  resources:
  - kustomizations
  verbs:
  - get
  - list
  - patch
  - watch
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - buckets
  - gitrepositories
  - helmcharts
  - helmrepositories
  - ocirepositories
  verbs:
  - get
  - list
  - patch
  - watch
