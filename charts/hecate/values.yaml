# Hecate — promotion and release orchestration for FluxCD.

image:
  repository: ghcr.io/olafkfreund/hecate-controller
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# More than one replica needs leaderElection, or they will fight over the same
# Passages. The chart enforces that rather than trusting the combination.
replicaCount: 1
leaderElection: false

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  # Where cloud identity is wired in: IRSA, Workload Identity, Managed Identity.
  # Registry credentials then need no Secret at all.
  annotations: {}

rbac:
  # Hecate reads Flux resources and never writes them (D3). Disable only if you
  # manage the ClusterRole yourself.
  create: true

userRoles:
  # ClusterRoles for people: hecate-viewer, hecate-promoter, hecate-approver.
  # Created unbound — who may promote and who may approve is a question about
  # your organisation. Promoting and approving are separate on purpose; binding
  # both to the same subject is a choice, not the default.
  create: true

hecate:
  # Refuse a Gate watching resources outside its own namespace. Matches the
  # posture Flux ships on its own controllers (D11). Set false only on a
  # single-tenant cluster, and know what you are turning off.
  noCrossNamespaceRefs: true

  # Scratch space for Passage steps. Disposable by design: steps must tolerate
  # it being empty on any invocation (D19), so an emptyDir is sufficient and a
  # PersistentVolume would be machinery for nothing.
  workRoot: /var/lib/hecate/passages
  workDirSizeLimit: 1Gi

  # /tmp, for code that needs a real file rather than a buffer. Small on
  # purpose: nothing here is meant to be large or to outlive the step that
  # wrote it. It exists because the root filesystem is read-only, and a
  # hardened container with nowhere to write is one where SSH host-key
  # verification cannot run.
  tmpDirSizeLimit: 16Mi

  logLevel: info
  # json in production; console is only readable during development.
  logFormat: json

# The HTTP API, for surfaces that cannot hold a kubeconfig — a UI, a dashboard,
# a bot. Off by default: it is a network-reachable write path, and turning one
# on should be a decision.
#
# It authenticates nobody itself. A caller presents a Kubernetes bearer token
# and Hecate asks the API server who they are and whether they may act, so
# cluster RBAC is the permission model and there is no second one to keep in
# step. Bind the hecate-promoter and hecate-approver ClusterRoles above.
api:
  enabled: false
  replicaCount: 2
  port: 8443
  tls:
    # Secret with tls.crt and tls.key — cert-manager's output works as-is.
    # Without it Hecate serves plain HTTP and bearer tokens cross the network in
    # clear, which the chart refuses unless you say allowInsecure.
    secretName: ""
  # Only for a mesh or ingress that terminates TLS in front of Hecate.
  allowInsecure: false

  # Browser sign-in.
  #
  # The API itself needs none of this: a caller presenting a Kubernetes bearer
  # token is authenticated by TokenReview, which is how the CLI talks to it. But
  # the UI has no token box — it redirects to /auth/login on a 401 — so without
  # OIDC the web interface loads and bounces off a route that answers nothing.
  # Leave disabled for an API-only deployment; enable it to use the UI.
  oidc:
    enabled: false
    # The provider's issuer URL. Must be reachable BOTH from the browser and
    # from inside the cluster, and must match the `iss` claim exactly — a
    # trailing slash difference is rejected with a message about the issuer
    # rather than about the slash.
    #
    # **The cluster must trust this same issuer.** Hecate authorises through
    # TokenReview, so a token this provider issues is only useful if the
    # Kubernetes API server also accepts it. Configure the API server's OIDC
    # flags, or on EKS an identity provider config, against the same issuer and
    # client ID. Skip that and every login succeeds while every request that
    # follows is rejected — which reads as a broken UI rather than a missing
    # cluster setting.
    issuer: ""
    clientID: ""
    # The client secret is read from a Secret, never from values: anything set
    # here ends up in the Helm release, which is readable by anyone who can
    # `helm get values`.
    clientSecretRef:
      name: ""
      key: clientSecret
    # Where the provider sends the browser back. Must be an absolute URL ending
    # /auth/callback, and must be registered with the provider — a mismatch
    # fails at the provider with an error the application never sees.
    redirectURL: ""
    # Extra scopes BEYOND openid, which hecate-api always requests. Adding
    # openid here asks for it twice.
    scopes: "profile,email,groups"
    # Allow the session cookie over plain HTTP. Local development only: it is
    # the difference between a session token the network can read and one it
    # cannot. Note this is about the COOKIE, not about verifying the issuer's
    # certificate — there is no option to skip that, deliberately.
    insecureCookie: false

  # The settings screen's write actions: granting someone a Hecate role,
  # storing a remote cluster's kubeconfig, pointing a Gate at a different
  # evidence server.
  #
  # Off by default, and the default is the important part. Turning it on grants
  # the API's ServiceAccount the right to create ClusterRoleBindings and to
  # read and write Secrets — the largest grant in this chart. hecate-api
  # authorises the caller against each of those before it writes and will bind
  # only the three roles above, so it is not an escalation path; it is still a
  # decision worth making deliberately rather than inheriting.
  #
  # Note also that a Gate edited here is a Gate edited in the cluster. If your
  # Gates come from git, Flux restores the committed value on its next sync.
  settings:
    writable: false

  service:
    type: ClusterIP
    port: 443
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Browser access to the API.
#
# Separate from `api.service` because exposing the UI is a different decision
# from letting things inside the cluster call the API. A ClusterIP is enough for
# the CLI and for anything in-cluster; a person with a browser needs a route in.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  # TLS at the ingress. With this set, api.allowInsecure is the matching choice
  # for the backend — TLS terminates here rather than at Hecate.
  tls:
    enabled: false
    secretName: ""

metrics:
  enabled: true
  port: 8080
  service:
    enabled: true
    annotations: {}
  # The exemplar Grafana dashboard, as a ConfigMap the Grafana sidecar picks up.
  # Off by default: without a sidecar watching for it, it is an unused object.
  dashboard:
    enabled: false
    label: grafana_dashboard
    labelValue: "1"

# OpenTelemetry. Standard OTEL_* variables, so this drops into an existing
# collector with no Hecate-specific configuration.
#
# Off unless `endpoint` is set: the SDK would otherwise export to localhost:4318
# and log connection failures forever about a collector nobody deployed.
otel:
  enabled: false
  endpoint: ""            # e.g. http://otel-collector.observability:4317
  protocol: grpc
  serviceName: hecate
  extraEnv: {}

# Fides evidence gating. Lands in M4; the wiring is here so credentials are
# never inline — only ever a Secret reference.
fides:
  enabled: false
  serverURL: ""
  # Secret holding an API token under `token`. Never put the token in values.
  tokenSecret:
    name: ""
    key: token

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""

# Hardened by default. The controller needs no privileges, no root and no
# writable root filesystem — the only writable path is the scratch emptyDir.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
