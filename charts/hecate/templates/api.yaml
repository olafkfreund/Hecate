{{- if .Values.api.enabled }}
{{- if and (not .Values.api.tls.secretName) (not .Values.api.allowInsecure) }}
{{- fail "api.enabled without api.tls.secretName sends bearer tokens in clear. Set api.tls.secretName, or api.allowInsecure=true if TLS terminates in front of Hecate." }}
{{- end }}
{{/*
  The API server, a separate Deployment from the controller.

  Separate because they fail and scale differently: the controller is a
  singleton that must not race itself, while the API is stateless and can run as
  many replicas as there is traffic for. Putting them in one pod would tie the
  API's availability to leader election, which has nothing to do with it.

  The same image, though, and the same ServiceAccount — the API's only extra
  permissions are `create` on TokenReview and SubjectAccessReview, and those are
  in the generated ClusterRole because pkg/api carries the markers.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hecate.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hecate.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "hecate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "hecate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "hecate.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/hecate-api"]
          args:
            - --addr=:{{ .Values.api.port }}
            {{- if .Values.api.tls.secretName }}
            - --tls-cert-file=/etc/hecate/tls/tls.crt
            - --tls-private-key-file=/etc/hecate/tls/tls.key
            {{- end }}
            {{- if .Values.api.oidc.enabled }}
            - --oidc-issuer={{ required "api.oidc.issuer is required when api.oidc.enabled" .Values.api.oidc.issuer }}
            - --oidc-client-id={{ required "api.oidc.clientID is required when api.oidc.enabled" .Values.api.oidc.clientID }}
            - --oidc-redirect-url={{ required "api.oidc.redirectURL is required when api.oidc.enabled — the provider rejects a mismatch before Hecate sees the request" .Values.api.oidc.redirectURL }}
            - --oidc-scopes={{ .Values.api.oidc.scopes }}
            {{- if .Values.api.oidc.insecureCookie }}
            - --oidc-insecure-cookie
            {{- end }}
            {{- end }}
          {{- if .Values.api.oidc.enabled }}
          env:
            # From a Secret rather than an argument: a client secret on a
            # command line is visible in `ps` and in every process listing,
            # which is why hecate-api reads this one from the environment and
            # takes no flag for it.
            - name: HECATE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "api.oidc.clientSecretRef.name is required when api.oidc.enabled" .Values.api.oidc.clientSecretRef.name }}
                  key: {{ .Values.api.oidc.clientSecretRef.key }}
          {{- end }}
          ports:
            - name: {{ if .Values.api.tls.secretName }}https{{ else }}http{{ end }}
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          {{- $probeScheme := ternary "HTTPS" "HTTP" (ne (toString .Values.api.tls.secretName) "") }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.port }}
              scheme: {{ $probeScheme }}
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.port }}
              scheme: {{ $probeScheme }}
            initialDelaySeconds: 2
            periodSeconds: 10
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.api.tls.secretName }}
          volumeMounts:
            - name: tls
              mountPath: /etc/hecate/tls
              readOnly: true
          {{- end }}
      {{- if .Values.api.tls.secretName }}
      volumes:
        - name: tls
          secret:
            secretName: {{ .Values.api.tls.secretName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hecate.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hecate.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: {{ if .Values.api.tls.secretName }}https{{ else }}http{{ end }}
      port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.port }}
      protocol: TCP
  selector:
    {{- include "hecate.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
