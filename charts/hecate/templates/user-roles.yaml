{{- if .Values.userRoles.create }}
{{/*
  Roles for people, as opposed to the ClusterRole in rbac.yaml, which is what
  Hecate itself holds.

  Several of them rather than one, because #74 requires that the right to cross a
  Gate and the right to approve a crossing be separable: an approval the
  promoter can grant themselves is not an approval. They are different verbs on
  different resources, so binding one does not confer the other — and nothing in
  Hecate has to enforce that, because the API server already does.

  Deliberately unbound. Who is a promoter and who is an approver is a question
  about your organisation, and a chart that answered it with a default would be
  answering it wrong. Bind them per namespace:

    kubectl create rolebinding release-team \
      --clusterrole=hecate-promoter --group=release-team -n production

  These govern Hecate's own resources. They are not a substitute for Fides
  segregation of duties, which asks a different question — whether the evidence
  has been signed off, rather than whether this person may act.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hecate.fullname" . }}-viewer
  labels: {{- include "hecate.labels" . | nindent 4 }}
rules:
  - apiGroups: ["hecate.dev"]
    resources: ["beacons", "bundles", "gates", "passages"]
    verbs: ["get", "list", "watch"]
---
{{/*
  A promoter can ask a Gate to cross a Bundle. Whether it *may* cross is a
  separate question, judged by the same rules as an automatic crossing.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hecate.fullname" . }}-promoter
  labels: {{- include "hecate.labels" . | nindent 4 }}
rules:
  - apiGroups: ["hecate.dev"]
    resources: ["beacons", "bundles", "gates", "passages"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["hecate.dev"]
    resources: ["passages"]
    # create is a promotion; update is an abort. Note that this grants the
    # right at the Kubernetes level too, so a holder with direct cluster access
    # can create a Passage that the eligibility rules would have refused. That
    # is a property of the CRD being the API, not of the API server.
    verbs: ["create", "update", "patch"]
---
{{/*
  An approver can approve a Bundle for a Gate, and cannot promote. This is the
  half that makes four-eyes real, so it grants exactly one write.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hecate.fullname" . }}-approver
  labels: {{- include "hecate.labels" . | nindent 4 }}
rules:
  - apiGroups: ["hecate.dev"]
    resources: ["beacons", "bundles", "gates", "passages"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["hecate.dev"]
    resources: ["bundles/status"]
    verbs: ["update", "patch"]
---
{{/*
  A poker can tell a Beacon to look now, and nothing else — not even read.

  This is the grant a CI job needs after a push (#102), and it is deliberately
  the narrowest role here: a webhook credential that could also read every Gate
  in the namespace is a credential worth stealing. It carries no read rules for
  the same reason, since the endpoint answers with the request token and needs
  no listing to work.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hecate.fullname" . }}-poker
  labels: {{- include "hecate.labels" . | nindent 4 }}
rules:
  - apiGroups: ["hecate.dev"]
    resources: ["beacons"]
    verbs: ["update"]
---
{{/*
  A flux-operator can suspend, resume and reconcile the Flux resources a Gate
  watches.

  Its own role rather than a rule added to the promoter, because it is a bigger
  right than promoting. Suspending a Kustomization stops every future deploy of
  it, and is cluster state git will not restore — so it outlives whoever did it,
  where a crossing leaves a Passage saying who asked and can be undone by
  committing.

  The rules are on Flux's own resources, not Hecate's, because that is what is
  actually written. Someone who may already patch Kustomizations has this right
  without Hecate's help; someone who may not should not gain it by being given
  a Hecate role.

  Deliberately unbound by default. A cluster where every promoter could silently
  stop reconciliation is not the safe default, and the UI explains the refusal
  rather than hiding the buttons — a control that vanishes teaches nobody that
  the permission exists.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hecate.fullname" . }}-flux-operator
  labels: {{- include "hecate.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "ocirepositories", "helmcharts", "helmrepositories", "buckets"]
    verbs: ["get", "list", "patch"]
---
{{/*
  An author can open a pull request that proposes a Gate's step list
  (hecate#172). It never writes to this cluster: the write lands in a fleet
  repository as a pull request, for a human to review before it becomes a
  Gate at all.

  The grant is "create gates/author" — a virtual subresource that no API
  object answers to, so the only thing it authorises is Hecate's authoring
  endpoint (ActionAuthorPassage). This used to be "create gates", on the
  reasoning that a merged pull request is what creating a Gate's spec.passage
  would be. But RBAC has no notion of "this grant only proxies an HTTP
  endpoint": a subject bound to that role could `kubectl create -f gate.yaml`
  straight onto the cluster, skipping the review the whole feature exists for,
  and a hand-written Gate names the Fides evidence server it trusts. See D66.

  Its own role for the same reason flux-operator is its own role: a bigger and
  more distinct grant than anything promoter or approver carry, so
  deliberately unbound by default.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hecate.fullname" . }}-author
  labels: {{- include "hecate.labels" . | nindent 4 }}
rules:
  - apiGroups: ["hecate.dev"]
    resources: ["beacons", "bundles", "gates", "passages"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["hecate.dev"]
    resources: ["gates/author"]
    verbs: ["create"]
{{- end }}
